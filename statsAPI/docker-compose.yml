services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_URL: postgres://labuser:labpass@db:5432/acr
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: labpass
      POSTGRES_DB: stats
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d stats"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: