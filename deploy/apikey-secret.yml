apiVersion: v1
kind: Secret
metadata:
  name: acr-sync-api-key
  namespace: acr
type: Opaque
# stringData lets you write the value as plain text here;
# Kubernetes base64-encodes it automatically on apply.
# Swap the key name below (api-key) for whatever key your
# CronJob/pod actually references via secretKeyRef.
stringData:
  key: "f0c63a72-8f1b-11f1-8ed8-e67b2afcd4d3"

# Nøkkel er generert via kubectl, men denne står som en referanse.