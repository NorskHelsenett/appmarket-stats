# Default values for stats-ui
replicaCount: 3

image:
  repository: ncr.sky.nhn.no/appmarket-mgmt/acr-ui
  pullPolicy: Always
  tag: "alpha"

imagePullSecrets: [name: test-regcred]
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

service:
  type: NodePort
  port: 3000
  targetPort: 3000
  name: http

ingress:
  enabled: true
  className: "avi-ingress-class-helsenett"
  annotations:
    cert-manager.io/cluster-issuer: internpki
    dns.nhn.no/override-infrastructure: '{"infrastructure":["helsenett","internett"]}'
  hosts:
    - host: stats.appmarket.nhn.no
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: stats-ui-tls
      hosts:
        - stats.appmarket.nhn.no

hostRule:
  enabled: true
  name: stats-ui-hostrule
  fqdn: stats.appmarket.nhn.no
  analyticsProfile: NHN-System-Analytics-Profile
  analyticsPolicy:
    fullClientLogs:
      enabled: true
      throttle: DISABLED
  datascripts:
    - expose-nhn-office-devops
    - expose-nhn-office-client
    - bottom-deny-rule

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Database configuration
database:
  enabled: true
  name: stats-initdb
  instances: 3
  database: stats
  owner: stats
  storage:
    size: 20Gi

# Cronjob configuration
cronjob:
  enabled: true
  name: nightly-job
  schedule: "30 0 * * *"
  image:
    repository: ncr.sky.nhn.no/appmarket-mgmt/acr-sync
    tag: "alpha"
    pullPolicy: Always
  restartPolicy: OnFailure

# Environment variables
env:
  - name: DB_URL
    valueFrom:
      secretKeyRef:
        name: stats-initdb-app
        key: uri

# Secrets
secrets:
  database:
    name: stats-initdb-app
    create: false
  apiKey:
    name: stats-sync-api-key
    create: false

# Namespace
namespace: stats