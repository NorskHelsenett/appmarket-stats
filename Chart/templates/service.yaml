apiVersion: v1
kind: Service
metadata:
  name: {{ include "stats-ui.fullname" . }}-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "stats-ui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: {{ .Values.service.name }}
  selector:
    {{- include "stats-ui.selectorLabels" . | nindent 4 }}