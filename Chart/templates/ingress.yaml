{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "acr-ui.fullname" . }}-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "acr-ui.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "acr-ui.fullname" $ }}-service
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
---
{{- if .Values.hostRule.enabled }}
apiVersion: ako.vmware.com/v1alpha1
kind: HostRule
metadata:
  name: {{ .Values.hostRule.name }}
  namespace: {{ .Values.namespace }}
spec:
  virtualhost:
    fqdn: {{ .Values.hostRule.fqdn }}
    analyticsProfile: {{ .Values.hostRule.analyticsProfile }}
    analyticsPolicy:
      fullClientLogs:
        enabled: {{ .Values.hostRule.analyticsPolicy.fullClientLogs.enabled }}
        throttle: {{ .Values.hostRule.analyticsPolicy.fullClientLogs.throttle }}
    datascripts:
      {{- range .Values.hostRule.datascripts }}
      - {{ . }}
      {{- end }}
{{- end }}
{{- end }}