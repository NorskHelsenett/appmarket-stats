apiVersion: v1
kind: ServiceAccount
metadata:
  name: refresh-api-key-sa
  namespace: stats

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: refresh-api-key-role
  namespace: stats
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["stats-sync-api-key"]
    verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: refresh-api-key-rolebinding
  namespace: stats
subjects:
  - kind: ServiceAccount
    name: refresh-api-key-sa
    namespace: stats
roleRef:
  kind: Role
  name: refresh-api-key-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: refresh-api-key-script
  namespace: stats
data:
  refresh.sh: |
    #!/bin/sh
    set -eu

    NAMESPACE="${NAMESPACE:?NAMESPACE not set}"
    SECRET_NAME="${SECRET_NAME:?SECRET_NAME not set}"
    SECRET_KEY="${SECRET_KEY:-api-key}"
    REFRESH_URL="${REFRESH_URL:-https://api.ror.nhn.no/v2/self/apikeys}"
    RESPONSE_KEY_FIELD="${RESPONSE_KEY_FIELD:-token}"
    REQUEST_NAME_FIELD="${REQUEST_NAME_FIELD:-name}"
    TTL_MS="${TTL_MS:-8640000000}"

    echo "Fetching current key from secret '${SECRET_NAME}' in namespace '${NAMESPACE}'..."
    CURRENT_KEY=$(kubectl get secret "${SECRET_NAME}" -n "${NAMESPACE}" \
      -o jsonpath="{.data.${SECRET_KEY}}" | base64 -d | tr -d '\n\r')

    if [ -z "${CURRENT_KEY}" ]; then
      echo "ERROR: could not read current key from secret '${SECRET_NAME}' (key '${SECRET_KEY}')." >&2
      exit 1
    fi

    KEY_NAME="$(date -u +%Y-%m-%d)-${SECRET_NAME}"
    BODY=$(jq -n \
      --arg name "${KEY_NAME}" \
      --arg field "${REQUEST_NAME_FIELD}" \
      --argjson ttl "${TTL_MS}" \
      '{($field): $name, ttl: $ttl}')

    echo "Requesting new key '${KEY_NAME}' (ttl=${TTL_MS}ms) from ${REFRESH_URL}..."

    HTTP_RESPONSE=$(curl -sS -X POST "${REFRESH_URL}" \
      -H "X-API-KEY: ${CURRENT_KEY}" \
      -H "Content-Type: application/json" \
      -d "${BODY}" \
      -w '\n%{http_code}')

    HTTP_STATUS=$(printf '%s' "${HTTP_RESPONSE}" | tail -n1)
    RESPONSE=$(printf '%s' "${HTTP_RESPONSE}" | sed '$d')

    if [ "${HTTP_STATUS}" != "200" ] && [ "${HTTP_STATUS}" != "201" ]; then
      echo "WARNING: API returned HTTP ${HTTP_STATUS} (expected 2xx). Known API bug: a key may have been issued anyway -- attempting to extract it from the response body." >&2
    fi

    NEW_KEY=$(printf '%s' "${RESPONSE}" | jq -r ".${RESPONSE_KEY_FIELD} // empty")

    if [ -z "${NEW_KEY}" ]; then
      echo "ERROR: response did not contain a usable key under field '${RESPONSE_KEY_FIELD}' (HTTP status was ${HTTP_STATUS})." >&2
      echo "Top-level fields in the response were: $(printf '%s' "${RESPONSE}" | jq -c 'keys' 2>/dev/null || echo 'unparseable JSON')" >&2
      exit 1
    fi

    NEW_KEY_B64=$(printf '%s' "${NEW_KEY}" | base64 | tr -d '\n')

    echo "Patching secret '${SECRET_NAME}' with the new key..."
    kubectl patch secret "${SECRET_NAME}" -n "${NAMESPACE}" \
      --type=json \
      -p="[{\"op\": \"replace\", \"path\": \"/data/${SECRET_KEY}\", \"value\": \"${NEW_KEY_B64}\"}]"

    echo "Done. Secret '${SECRET_NAME}' updated in namespace '${NAMESPACE}'."

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: refresh-api-key
  namespace: stats
spec:
  schedule: "0 3 1 1,4,7,10 *"
  timeZone: "Europe/Oslo"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: refresh-api-key-sa
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: "test-regcred"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh-api-key
              image: ncr.sky.nhn.no/dockerhub/alpine/k8s:1.30.2
              command: ["sh", "/scripts/refresh.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: HOME
                  value: "/tmp"
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: SECRET_NAME
                  value: "stats-sync-api-key"
                - name: SECRET_KEY
                  value: "key"
                - name: REFRESH_URL
                  value: "https://api.ror.nhn.no/v2/self/apikeys"
                - name: RESPONSE_KEY_FIELD
                  value: "token"
                - name: REQUEST_NAME_FIELD
                  value: "name"
                - name: TTL_MS
                  value: "604800000"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
          volumes:
            - name: script
              configMap:
                name: refresh-api-key-script
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
