apiVersion: v1
kind: ServiceAccount
metadata:
  name: refresh-api-key-sa
  namespace: acr

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: refresh-api-key-role
  namespace: acr
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["acr-sync-api-key"]
    verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: refresh-api-key-rolebinding
  namespace: acr
subjects:
  - kind: ServiceAccount
    name: refresh-api-key-sa
    namespace: acr
roleRef:
  kind: Role
  name: refresh-api-key-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: refresh-api-key-script
  namespace: acr
data:
  refresh.sh: |
    #!/bin/sh
    set -eu

    NAMESPACE="${NAMESPACE:?NAMESPACE not set}"
    SECRET_NAME="${SECRET_NAME:?SECRET_NAME not set}"
    SECRET_KEY="${SECRET_KEY:-api-key}"
    REFRESH_URL="${REFRESH_URL:-https://api.ror.nhn.no/v2/self/apikeys}"
    # Field in the API's RESPONSE body holding the new key's value.
    # Confirmed: the response is a flat {"key": "<value>"} object.
    RESPONSE_KEY_FIELD="${RESPONSE_KEY_FIELD:-key}"
    # Field in the REQUEST body used to label the new key being created.
    REQUEST_NAME_FIELD="${REQUEST_NAME_FIELD:-name}"

    echo "Fetching current key from secret '${SECRET_NAME}' in namespace '${NAMESPACE}'..."
    CURRENT_KEY=$(kubectl get secret "${SECRET_NAME}" -n "${NAMESPACE}" \
      -o jsonpath="{.data.${SECRET_KEY}}" | base64 -d)

    if [ -z "${CURRENT_KEY}" ]; then
      echo "ERROR: could not read current key from secret '${SECRET_NAME}' (key '${SECRET_KEY}')." >&2
      exit 1
    fi

    # Give each generated key a unique, traceable name: <date>-<secret-name>,
    # e.g. 2026-08-17-secret-x. Swap REQUEST_NAME_FIELD if the API calls this
    # field something other than "name".
    KEY_NAME="$(date -u +%Y-%m-%d)-${SECRET_NAME}"
    BODY=$(jq -n --arg name "${KEY_NAME}" --arg field "${REQUEST_NAME_FIELD}" '{($field): $name}')

    echo "Requesting new key '${KEY_NAME}' from ${REFRESH_URL}..."
    RESPONSE=$(curl -sS -f -X POST "${REFRESH_URL}" \
      -H "Authorization: Bearer ${CURRENT_KEY}" \
      -H "Content-Type: application/json" \
      -d "${BODY}")

    NEW_KEY=$(printf '%s' "${RESPONSE}" | jq -r ".${RESPONSE_KEY_FIELD} // empty")

    if [ -z "${NEW_KEY}" ]; then
      echo "ERROR: response did not contain a usable key under field '${RESPONSE_KEY_FIELD}'." >&2
      echo "Top-level fields in the response were: $(printf '%s' "${RESPONSE}" | jq -c 'keys' 2>/dev/null || echo 'unparseable JSON')" >&2
      exit 1
    fi

    NEW_KEY_B64=$(printf '%s' "${NEW_KEY}" | base64 | tr -d '\n')

    echo "Patching secret '${SECRET_NAME}' with the new key..."
    kubectl patch secret "${SECRET_NAME}" -n "${NAMESPACE}" \
      --type=json \
      -p="[{\"op\": \"replace\", \"path\": \"/data/${SECRET_KEY}\", \"value\": \"${NEW_KEY_B64}\"}]"

    echo "Done. Secret '${SECRET_NAME}' updated in namespace '${NAMESPACE}'."

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: refresh-api-key
  namespace: acr
spec:
  # Runs at 03:00 on the 1st of January, April, July and October (quarterly).
  schedule: "0 3 1 1,4,7,10 *"
  timeZone: "Europe/Oslo" # requires Kubernetes 1.27+; drop this field and
                          # convert the schedule to UTC on older clusters
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: refresh-api-key-sa
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh-api-key
              image: ncr.sky.nhn.no/dockerhub/alpine/k8s:1.30.2 # bundles kubectl, curl and jq
              command: ["sh", "/scripts/refresh.sh"]
              # allowPrivilegeEscalation and capabilities can only be set at
              # the container level, not inherited from the pod securityContext.
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: HOME
                  value: "/tmp" # kubectl needs a writable HOME for its cache dir; UID 65532 has no passwd entry so $HOME isn't set otherwise
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: SECRET_NAME
                  value: "acr-sync-api-key"
                - name: SECRET_KEY
                  value: "key"
                - name: REFRESH_URL
                  value: "https://api.ror.nhn.no/v2/self/apikeys"
                - name: RESPONSE_KEY_FIELD
                  value: "key"
                - name: REQUEST_NAME_FIELD
                  value: "name"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
          volumes:
            - name: script
              configMap:
                name: refresh-api-key-script
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
